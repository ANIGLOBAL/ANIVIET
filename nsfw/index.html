  <style>
    :root {
      --accent: #ff4b5c;
      --accent-hover: #ff6b7a;
      --bg: #131018;
      --card: #1d1822;
      --border: #2e2733;
      --muted: #9a86a8;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      padding: 0 !important;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; }

    /* ===== Top nav ===== */
    .topnav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(19,16,24,.92);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,75,92,.14);
    }
    .nav-inner {
      max-width: 1280px; margin-inline: auto;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px 8px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-family: "Space Grotesk", sans-serif; font-weight: 700;
      color: #fff; white-space: nowrap; flex-shrink: 0;
    }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #7a2d8f);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #fff; font-size: 18px;
    }
    .brand-text small { font-size: 10px; color: var(--accent); letter-spacing: .1em; margin-left: 6px; vertical-align: middle; }
    .search-box { flex: 1; min-width: 140px; display: flex; gap: 6px; }
    .search-box input {
      flex: 1; min-width: 0; background: #1d1d1d; border: 1px solid var(--border);
      border-radius: 999px; color: #fff; padding: 9px 16px; font: inherit; font-size: .9rem;
      outline: none; transition: border-color .15s ease;
    }
    .search-box input::placeholder { color: #777; }
    .search-box input:focus { border-color: var(--accent); }
    .icon-btn {
      width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%;
      background: #1d1d1d; border: 1px solid var(--border); color: #fff;
      font-size: 15px; cursor: pointer; transition: all .15s ease;
    }
    .icon-btn:hover { border-color: var(--accent); background: rgba(255,255,255,.06); }
    .btn-random {
      flex-shrink: 0; border-radius: 999px; border: 1px solid var(--border);
      background: transparent; color: #ddd; font: inherit; font-size: .85rem; font-weight: 600;
      padding: 9px 14px; cursor: pointer; transition: all .15s ease; white-space: nowrap;
    }
    .btn-random:hover { border-color: var(--accent); color: var(--accent); }
    .auth-link {
      flex-shrink: 0; margin-left: auto;
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      color: #fff; border-radius: 999px; padding: 8px 14px;
      font-size: 13px; font-weight: 600; white-space: nowrap;
      max-width: 180px; overflow: hidden; text-overflow: ellipsis;
      transition: all .15s ease;
    }
    .auth-link:hover { border-color: var(--accent); background: rgba(255,255,255,.1); }

    /* ===== Category chips ===== */
    .cat-row {
      max-width: 1280px; margin-inline: auto;
      display: flex; gap: 8px; padding: 2px 20px 12px;
      overflow-x: auto; scrollbar-width: none;
    }
    .cat-row::-webkit-scrollbar { display: none; }
    .cat-row a {
      flex-shrink: 0; cursor: pointer;
      border: 1px solid var(--border); border-radius: 999px;
      color: #bbb; font-size: 13px; font-weight: 600;
      padding: 7px 14px; transition: all .15s ease;
    }
    .cat-row a:hover { color: #fff; border-color: #555; }
    .cat-row a.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ===== Content ===== */
    .page-wrap { max-width: 1280px; margin-inline: auto; padding: 18px 20px 30px; }
    .stats-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 4px 0 14px; }
    .stat-item {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--card); color: #ccc; border: 1px solid var(--border);
      padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
    }
    .stat-item span { font-weight: 700; color: var(--accent); }
    .search-info { color: var(--muted); font-size: 13px; padding: 2px 0 10px; }
    .search-info b { color: var(--accent); }

    /* ===== Anime/gallery card grid ===== */
    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .movie-card {
      position: relative; background: var(--card); border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
    }
    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 32px rgba(255,75,92,.18);
      border-color: var(--accent);
    }
    .movie-thumb { position: relative; aspect-ratio: 2 / 3; overflow: hidden; background: #222; }
    .movie-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease; }
    .movie-card:hover .movie-thumb img { transform: scale(1.06); }
    .movie-thumb::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(19,16,24,.55), transparent 40%);
      pointer-events: none;
    }
    .movie-type {
      position: absolute; top: .5rem; left: .5rem; z-index: 2;
      background: var(--accent); color: #fff;
      border-radius: 999px; font-size: 10px; font-weight: 700;
      padding: 3px 9px; letter-spacing: .4px;
    }
    .movie-ep {
      position: absolute; bottom: .5rem; right: .5rem; z-index: 2;
      background: rgba(15,12,18,.78); backdrop-filter: blur(4px);
      border-radius: 999px; font-size: 11px; font-weight: 600;
      padding: 3px 9px; color: #eee;
    }
    .movie-info { padding: 10px 12px 12px; }
    .movie-title {
      margin: 0; font-size: 14px; font-weight: 600; color: #fff; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .movie-original {
      margin: 3px 0 0; font-size: 12px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ===== Manga list rows ===== */
    .manga-list { display: flex; flex-direction: column; gap: 10px; }
    .manga-list-item {
      display: flex; gap: 14px; align-items: center;
      background: var(--card); border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px; padding: 10px 14px 10px 10px; overflow: hidden;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;

    .manga-list-item:hover {

      border-color: var(--accent);
    }
    .manga-list-thumb {
      position: relative; width: 64px; flex-shrink: 0;
      border-radius: 10px; overflow: hidden; background: #222;
    }
    .manga-list-thumb img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block; }
    .manga-list-badge {
      position: absolute; bottom: 4px; left: 4px;
      background: rgba(15,12,18,.82); color: #ccc;
      border-radius: 999px; font-size: 9px; font-weight: 700; padding: 2px 7px;
    }
    .manga-list-badge.vi { background: var(--accent); color: #fff; }
    .manga-list-info { flex: 1; min-width: 0; }
    .manga-list-name { margin: 2px 0; font-size: 15px; font-weight: 700; color: #fff; }
    .manga-list-orig {
      margin: 0; font-size: 12px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .manga-list-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .manga-list-chip {
      background: #262130; color: #aaa; border-radius: 999px;
      font-size: 11px; padding: 2px 10px;
    }

    .ln-tag {
      background: rgba(255,255,255,.05); border: 1px solid var(--border);
      color: #bbb; border-radius: 999px; font-size: 11px; padding: 2px 10px;
    }

    /* ===== Pagination / empty ===== */
    .pagination { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 22px 0 6px; }
    .pg-btn {
      min-width: 36px; height: 36px; padding: 0 10px;
      background: #1d1d1d; border: 1px solid var(--border); color: #ccc;
      border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .15s ease;
    }
    .pg-btn:hover:not(.disabled):not(.active) { border-color: var(--accent); color: #fff; }
    .pg-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pg-btn.disabled { opacity: .4; cursor: default; }
    .empty-state { padding: 60px 20px; text-align: center; }
    .empty-title { font-size: 17px; font-weight: 600; color: var(--accent); margin: 0; }
    .empty-sub { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

    .site-footer {

    @media (max-width: 720px) {

      .search-box { order: 10; flex-basis: 100%; }

      .movie-grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
      .page-wrap { padding: 14px 14px 24px; }
      .cat-row { padding: 2px 14px 10px; }
      .nav-inner { padding: 10px 14px 8px; }
    }
  </style>

    var container = document.getElementById('categorySections');
    var searchInput = document.getElementById('searchInput');
    var searchBtn = document.getElementById('searchBtn');
    var navLinks = document.querySelectorAll('#categoryNav a');
    var currentCategory = 'anime';
    var currentPage = 1;
    var PER_PAGE = 36;

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var typeLabels = { 'anime': 'Anime', 'manga': 'Manga', 'manhwa': 'Manhwa', 'manhua': 'Manhua', 'light-novel': 'Light Novel', 'gallery': 'Galleries' };

    var statsBar = document.getElementById('statsBar');
    function updateStats() {
      var counts = {};
      items.forEach(function(m) {
        if (!m.adult) return;
        var t = m.type;
        counts[t] = (counts[t] || 0) + 1;
        counts._total = (counts._total || 0) + 1;
      });
      var order = ['anime','manga','manhwa','manhua','light-novel','gallery'];
      var html = '<span class="stat-item">Tổng: <span>' + (counts._total||0) + '</span></span>';
      order.forEach(function(t) {
        if (counts[t]) html += '<span class="stat-item">' + typeLabels[t] + ': <span>' + counts[t] + '</span></span>';
      });
      statsBar.innerHTML = html;
    }


    function renderMangaList(pageItems) {
      var list = document.createElement('div');
      list.className = 'manga-list';
      pageItems.forEach(function(item) {
        var row = document.createElement('a');
        row.className = 'manga-list-item';
        row.href = item.page;
        var thumb = document.createElement('div');
        thumb.className = 'manga-list-thumb';
        thumb.innerHTML = '<img src="' + item.thumb + '" alt="' + (item.name || '').replace(/</g, '&lt;') + '" loading="lazy">';
        var badge = document.createElement('span');
        badge.className = 'manga-list-badge' + (item.hasVi ? ' vi' : '');
        badge.textContent = item.hasVi ? 'Vietsub' : 'EN';
        thumb.appendChild(badge);
        var info = document.createElement('div');
        info.className = 'manga-list-info';
        var name = document.createElement('h3');
        name.className = 'manga-list-name';
        name.textContent = item.name;
        info.appendChild(name);
        if (item.orig && item.orig !== item.name) {
          var orig = document.createElement('p');
          orig.className = 'manga-list-orig';
          orig.textContent = item.orig;
          info.appendChild(orig);
        }
        var meta = document.createElement('div');
        meta.className = 'manga-list-meta';
        var chips = [];
        if (item.year) chips.push('Năm: ' + item.year);
        if (item.status) chips.push(item.status);
        if (item.langs) chips.push(item.langs);
        chips.forEach(function(t) {
          var c = document.createElement('span');
          c.className = 'manga-list-chip';
          c.textContent = t;
          meta.appendChild(c);
        });
        info.appendChild(meta);
        if (item.tags && item.tags.length) {
          var tg = document.createElement('div');
          tg.className = 'ln-tags';
          item.tags.forEach(function(t) {
            var s = document.createElement('span');
            s.className = 'ln-tag';
            s.textContent = t;
            tg.appendChild(s);
          });
          info.appendChild(tg);
        }
        row.appendChild(thumb);
        row.appendChild(info);
        list.appendChild(row);
      });
      return list;
    }

    function filter() {
      var kw = (searchInput.value || '').toLowerCase().trim();
      var category = currentCategory;

      var filtered = items.filter(function(m) {
        if (!m.adult) return false;
        if (m.type !== category) return false;
        if (!kw) return true;
        return m.name.toLowerCase().indexOf(kw) !== -1 || m.orig.toLowerCase().indexOf(kw) !== -1;
      });

      // Dòng thông báo số kết quả tìm thấy (giống shop).
      var searchInfo = document.getElementById('searchInfo');
      if (kw) {
        searchInfo.style.display = 'block';
        searchInfo.innerHTML = 'T&#236;m th&#7845;y <b>' + filtered.length + '</b> k&#7871;t qu&#7843; cho &ldquo;' + esc(kw) + '&rdquo;';
      } else {
        searchInfo.style.display = 'none';
        searchInfo.innerHTML = '';
      }

      var totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
      if (currentPage > totalPages) currentPage = totalPages;
      var start = (currentPage - 1) * PER_PAGE;
      var pageItems = filtered.slice(start, start + PER_PAGE);

      container.innerHTML = '';
      if (category === 'manga' || category === 'manhwa' || category === 'manhua') {
        if (pageItems.length > 0) {
          container.appendChild(renderMangaList(pageItems));
        } else {
          container.innerHTML = '<div class="empty-state"><p class="empty-title">Chưa có nội dung 18+</p><p class="empty-sub">Kho mục này chưa có gì, quay lại sau.</p></div>';
        }
      } else {
      var grid = document.createElement('div');
      grid.className = 'movie-grid';

      pageItems.forEach(function(item) {
        var card = document.createElement('a');
        card.className = 'movie-card';
        card.href = item.page;
        var thumb = document.createElement('div');
        thumb.className = 'movie-thumb';
        thumb.innerHTML = '<img src="' + item.thumb + '" alt="' + item.name + '" loading="lazy">';
        var typeBadge = document.createElement('span');
        typeBadge.className = 'movie-type adult-type-badge';
        typeBadge.textContent = '18+';
        var ep = document.createElement('span');
        ep.className = 'movie-ep';
        ep.textContent = item.ep;
        var info = document.createElement('div');
        info.className = 'movie-info';
        var title = document.createElement('h3');
        title.className = 'movie-title';
        title.textContent = item.name;
        var orig = document.createElement('p');
        orig.className = 'movie-original';
        orig.textContent = item.orig;
        info.appendChild(title);
        info.appendChild(orig);
        thumb.appendChild(typeBadge);
        thumb.appendChild(ep);
        card.appendChild(thumb);
        card.appendChild(info);
        grid.appendChild(card);
      });

      if (pageItems.length > 0) {
        container.appendChild(grid);
      } else {
        container.innerHTML = '<div class="empty-state"><p class="empty-title">Chưa có nội dung 18+</p><p class="empty-sub">Kho mục này chưa có gì, quay lại sau.</p></div>';
      }
      }

      if (totalPages > 1) {
        var pg = document.createElement('div');
        pg.className = 'pagination';
        var prev = document.createElement('button');
        prev.textContent = '\u00AB';
        prev.className = 'pg-btn' + (currentPage <= 1 ? ' disabled' : '');
        if (currentPage > 1) { prev.addEventListener('click', function() { currentPage--; filter(); }); pg.appendChild(prev); } else { var span = document.createElement('span'); span.className = 'pg-btn disabled'; span.textContent = '\u00AB'; pg.appendChild(span); }
        for (var i = 1; i <= totalPages; i++) {
          var btn = document.createElement('button');
          btn.textContent = i;
          btn.className = 'pg-btn' + (i === currentPage ? ' active' : '');
          btn.addEventListener('click', (function(p) { return function() { currentPage = p; filter(); }; })(i));
          pg.appendChild(btn);
        }
        var next = document.createElement('button');
        next.textContent = '\u00BB';
        next.className = 'pg-btn' + (currentPage >= totalPages ? ' disabled' : '');
        if (currentPage < totalPages) { next.addEventListener('click', function() { currentPage++; filter(); }); pg.appendChild(next); } else { var span2 = document.createElement('span'); span2.className = 'pg-btn disabled'; span2.textContent = '\u00BB'; pg.appendChild(span2); }
        container.appendChild(pg);
      }
    }

    navLinks.forEach(function(link) {
      link.addEventListener('click', function() {
        navLinks.forEach(function(l) { l.classList.remove('active'); });
        link.classList.add('active');
        currentCategory = link.getAttribute('data-category');
        currentPage = 1;
        filter();
      });
    });

    searchBtn.addEventListener('click', function() { currentPage = 1; filter(); });
    searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { currentPage = 1; filter(); } });
    searchInput.addEventListener('input', function() { currentPage = 1; filter(); });
    document.getElementById('refreshBtn').addEventListener('click', function() { location.reload(); });

    document.getElementById('randomBtn').addEventListener('click', function() {
      var kw = (searchInput.value || '').toLowerCase().trim();
      var pool = items.filter(function(m) {
        if (!m.adult) return false;
        if (m.type !== currentCategory) return false;
        if (!kw) return true;
        return m.name.toLowerCase().indexOf(kw) !== -1 || m.orig.toLowerCase().indexOf(kw) !== -1;
      });
      if (pool.length === 0) return;
      var pick = pool[Math.floor(Math.random() * pool.length)];
      window.location.href = pick.page;
    });


    updateStats(); currentPage = 1; filter();

    (function () {
      var link = document.getElementById('authLink');
      var adminBtn = document.getElementById('adminLink');
      var s = document.createElement('script');
      s.src = 'signup-loginsystem.js';
      s.onload = function () {
        if (!window.AuthSystem) return;
        window.AuthSystem.me().then(function (user) {
          if (user) {
            link.title = 'Tài khoản: ' + (user.username || user.email);
            link.innerHTML = '&#128100; ' + (user.username || 'Tài khoản');
          } else {
            link.innerHTML = '&#128100; Đăng nhập';
          }
        });
        if (adminBtn) adminBtn.addEventListener('click', function () {
          if (window.AuthSystem.isAdmin()) {
            window.location.href = 'control-panel.html';
          } else {
            showAdminDenied();
          }
        });
      };
      document.head.appendChild(s);

      function showAdminDenied() {
        var m = document.getElementById('adminDeniedPopup');
        m.classList.add('active');
        m.addEventListener('click', function (e) {
          if (e.target === m || e.target.closest('.admin-denied-close')) m.classList.remove('active');
        });
      }
    })();
  </script>

  <div class="admin-denied-overlay" id="adminDeniedPopup">
    <div class="admin-denied-popup">
      <p>Bạn không có quyền admin</p>
      <button class="admin-denied-close">Đóng</button>
    </div>
  </div>

  </style>
